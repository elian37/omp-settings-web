<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>omp 设置中心</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: #16181d;
         color: #d7dae0; margin: 0 auto; padding: 20px; max-width: 860px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #8b93a1; font-size: 12px; margin-bottom: 14px; word-break: break-all; }
  .hdr { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .lang-switch { display: flex; flex: none; }
  .lang-switch button { background: #232732; border: 1px solid #3a4050; color: #8b93a1;
                        border-radius: 0; padding: 4px 12px; font-size: 12px; }
  .lang-switch button:first-child { border-radius: 6px 0 0 6px; }
  .lang-switch button:last-child { border-radius: 0 6px 6px 0; border-left: 0; }
  .lang-switch button.active { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tabs button { background: #232732; border: 1px solid #3a4050; color: #8b93a1;
                 border-radius: 8px; padding: 7px 18px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: #2d6cdf; border-color: #2d6cdf; color: #fff; }
  .role { display: flex; align-items: center; gap: 12px; padding: 10px 14px;
          border: 1px solid #2a2e37; border-radius: 8px; margin-bottom: 8px; background: #1c1f26; }
  .role .name { width: 110px; font-weight: 600; }
  .role .name small { display: block; font-weight: 400; color: #8b93a1; font-size: 11px; }
  .role .value { flex: none; font-family: Consolas, monospace; font-size: 13px; color: #9fd0ff; }
  select { background: #232732; color: #d7dae0; border: 1px solid #3a4050;
           border-radius: 6px; padding: 6px 8px; font-size: 13px; display: none;
           max-width: 360px; }
  select.group { min-width: 180px; max-width: 220px; }
  .role.editing { flex-wrap: wrap; }
  .role.editing select { display: inline-block; }
  button { background: #2d6cdf; color: #fff; border: 0; border-radius: 6px;
           padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: transparent; border: 1px solid #3a4050; color: #8b93a1; }
  button:hover { filter: brightness(1.15); }
  #toast { position: fixed; bottom: 20px; right: 20px; background: #234; padding: 10px 16px;
           border-radius: 8px; display: none; font-size: 13px; border: 1px solid #3a4050; }
  #toast.bad { background: #4a1d1d; border-color: #a33; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 240px; background: #232732; color: #d7dae0;
           border: 1px solid #3a4050; border-radius: 6px; padding: 7px 10px; font-size: 13px; }
  .toolbar label { font-size: 12px; color: #8b93a1; display: flex; gap: 5px; align-items: center; cursor: pointer; }
  .grp { margin: 16px 0 6px; font-size: 14px; font-weight: 700; color: #9fc3ff;
         border-bottom: 1px solid #2a2e37; padding-bottom: 4px; }
  .grp small { color: #6b7280; font-weight: 400; margin-left: 8px; }
  .row { border: 1px solid #242833; border-radius: 8px; background: #1c1f26;
         padding: 8px 12px; margin-bottom: 6px; }
  .row .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row .zhname { font-size: 13px; font-weight: 600; min-width: 150px; }
  .row .key { font-family: Consolas, monospace; font-size: 11px; color: #6b7280; }
  .row .badge { font-size: 10px; border-radius: 4px; padding: 1px 6px; }
  .badge.custom { background: #274a2d; color: #8ee08e; }
  .badge.default { background: #2b2f3a; color: #6b7280; }
  .badge.ro { background: #4a3a1d; color: #e0c98e; }
  .row input[type=text] { background: #232732; color: #d7dae0; border: 1px solid #3a4050;
           border-radius: 6px; padding: 5px 8px; font-size: 12px; width: 220px;
           font-family: Consolas, monospace; }
  .row select { display: inline-block; width: auto; min-width: 90px; }
  .row .desc { font-size: 11px; color: #8b93a1; margin-top: 4px; line-height: 1.5; }
  .row .save { padding: 4px 12px; font-size: 12px; }
  .row input:disabled, .row select:disabled { opacity: .45; }
  .count { font-size: 12px; color: #6b7280; }
  .settings-layout { display: flex; gap: 14px; align-items: flex-start; }
  #group-nav { flex: 0 0 200px; width: 200px; position: sticky; top: 12px;
               max-height: calc(100vh - 60px); overflow-y: auto;
               background: #1c1f26; border: 1px solid #2a2e37; border-radius: 8px; padding: 6px; }
  .nav-item { display: flex; justify-content: space-between; align-items: center; gap: 6px;
              padding: 5px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; color: #9aa2b1; }
  .nav-item:hover { background: #232732; color: #d7dae0; }
  .nav-item.active { background: #2d6cdf; color: #fff; }
  .nav-item.dim { opacity: .35; }
  .nav-item .gname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item .cnt { flex: none; font-size: 10px; color: #6b7280; background: #232732;
                   border-radius: 8px; padding: 0 6px; min-width: 14px; text-align: center; }
  .nav-item.active .cnt { background: rgba(255,255,255,.18); color: #fff; }
  #settings { flex: 1; min-width: 0; }
  .empty-hint { color: #6b7280; font-size: 13px; padding: 24px 0; text-align: center; }
  @media (max-width: 700px) {
    .settings-layout { flex-direction: column; }
    #group-nav { position: static; width: auto; flex: none; max-height: none;
                 align-self: stretch; max-width: 100%;
                 display: flex; overflow-x: auto; overflow-y: hidden; gap: 4px; padding: 4px; }
    .nav-item { flex: 0 0 auto; }
    .nav-item .gname { white-space: nowrap; }
  }
  #view-models .vm-prov { border: 1px solid #2a2e37; border-radius: 8px; background: #1c1f26;
                          margin-bottom: 8px; }
  .vm-head { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; }
  .vm-head .pname { font-weight: 700; color: #9fc3ff; flex: 1; }
  .vm-head .pcnt { font-size: 12px; color: #8b93a1; }
  .vm-head .caret { color: #6b7280; width: 12px; }
  .vm-head button { padding: 3px 10px; font-size: 12px; }
  .vm-list { padding: 2px 12px 8px 34px; display: none; }
  .vm-prov.open .vm-list { display: block; }
  .vm-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 12px; cursor: pointer; }
  .vm-item .sel { font-family: Consolas, monospace; color: #6b7280; font-size: 11px; }
  .vm-item.def .mname::after { content: attr(data-tag); margin-left: 6px; font-size: 10px;
                               background: #274a2d; color: #8ee08e; border-radius: 4px; padding: 1px 5px; }
  .vm-note { font-size: 12px; color: #8b93a1; margin-bottom: 10px; line-height: 1.6; }
  .vm-bar { position: sticky; bottom: 0; background: #16181d; padding: 10px 0;
            display: flex; gap: 10px; align-items: center; border-top: 1px solid #2a2e37; }
  .vm-bar .dirty { font-size: 12px; color: #e0c98e; }
  /* ---------- 用量 / Usage ---------- */
  .u-card { border: 1px solid #2a2e37; border-radius: 8px; background: #1c1f26;
            padding: 10px 12px; margin-bottom: 10px; }
  .u-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .u-head .pname { font-weight: 700; color: #9fc3ff; font-size: 14px; }
  .u-head .meta { font-size: 12px; color: #8b93a1; }
  .u-head .ftime { margin-left: auto; font-size: 11px; color: #6b7280; }
  .u-row { padding: 6px 0; border-top: 1px solid #242833; }
  .u-row .ltop { display: flex; justify-content: space-between; align-items: baseline;
                 gap: 10px; font-size: 13px; }
  .u-row .lname { font-weight: 600; }
  .u-row .lscope { font-size: 11px; color: #6b7280; margin-left: 8px; font-weight: 400; }
  .u-row .amt { font-family: Consolas, monospace; font-size: 12px; color: #d7dae0; }
  .u-bar { height: 8px; background: #232732; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .u-fill { height: 100%; border-radius: 4px; background: #3fb27f;
            transition: width .3s ease; }
  .u-fill.warning { background: #e0b34a; }
  .u-fill.exhausted, .u-fill.error { background: #e05a4a; }
  .u-fill.unknown { background: #4a5062; }
  .u-sub { display: flex; justify-content: space-between; gap: 10px;
           font-size: 11px; color: #8b93a1; margin-top: 5px; flex-wrap: wrap; }
  .u-sub .reset { color: #6b7280; }
  .u-note { font-size: 11px; color: #8b93a1; padding: 4px 0 2px; border-top: 1px solid #242833;
            line-height: 1.5; }
  .u-extra { font-size: 11px; color: #8b93a1; margin-bottom: 8px; line-height: 1.6; }
  .u-mini { padding: 2px 8px; font-size: 11px; }
  .u-redeem { background: #274a2d; color: #8ee08e; margin-top: 6px; }
  .u-redeem:disabled { opacity: .45; }
  .a-acct { border-top: 1px solid #2a2e37; padding-top: 8px; margin-top: 8px; }
  .u-head + .a-acct { border-top: 0; margin-top: 0; padding-top: 0; }
  .a-id { font-size: 13px; color: #d7dae0; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; margin-bottom: 4px; }
  .a-id .meta { font-size: 11px; color: #8b93a1; }
  .a-pol { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 6px; font-size: 12px; color: #8b93a1; }
  .a-pol input { width: 70px; padding: 2px 6px; }
  .a-tag { font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #2b2616; color: #e3b341; }
  .role .rdesc { flex: 1; min-width: 0; font-size: 11px; color: #8b93a1;
                 line-height: 1.55; white-space: normal; }
  .role.editing .rdesc { flex-basis: 100%; order: 10; }
  .roles-intro { font-size: 12px; color: #8b93a1; line-height: 1.7; margin-bottom: 12px;
                 padding: 10px 14px; border: 1px solid #2a2e37; border-radius: 8px;
                 background: #1c1f26; }
  /* ---------- 故障兜底（retry.fallbackChains） ---------- */
  .fb-sec .grp { margin-top: 22px; }
  .fb-sec select { display: inline-block; width: auto; min-width: 90px; }
  .fb-ed { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #2a2e37; }
  .fb-entry { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
  .fb-entry select { min-width: 70px; max-width: 300px; }
  .fb-entry .ord { color: #6b7280; font-size: 11px; width: 18px; text-align: right;
                   font-family: Consolas, monospace; }
  .fb-entry button { padding: 2px 8px; font-size: 12px; }
  .fb-mode { margin-right: 8px; }
  .fb-ops { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .fb-view { font-family: Consolas, monospace; font-size: 12px; color: #9fd0ff;
             word-break: break-all; }
  /* ---------- Ctrl+P 轮换顺序（cycleOrder） ---------- */
  .cy-sec .grp { margin-top: 22px; }
  .cy-name { font-weight: 600; font-size: 13px; width: 90px; overflow-wrap: anywhere; }
  .cy-warn { color: #e0c98e; font-size: 12px; }
  .cy-sec .fb-entry > .fb-view, .cy-sec .fb-entry > .cy-warn { flex: 1; min-width: 0; }
  .cy-add { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .cy-bind { display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
             flex-basis: 100%; margin: 4px 0 2px 24px; }
  .cy-dirty { font-size: 12px; color: #e0c98e; }
  @media (max-width: 700px) {
    body { padding: 16px; }
    .tabs { flex-wrap: wrap; }
    .tabs button { padding: 7px 12px; }
    .role { display: grid; grid-template-columns: minmax(0, 1fr) auto;
            align-items: start; gap: 8px 12px; }
    .role .name { width: auto; grid-column: 1; order: 1; }
    .role > button { grid-column: 2; order: 5; justify-self: end; }
    .role > button:first-of-type { order: 1; }
    .role .value { grid-column: 1 / -1; order: 2; min-width: 0;
                   overflow-wrap: anywhere; }
    .role .rdesc { grid-column: 1 / -1; order: 3; }
    .role.editing select { grid-column: 1 / -1; order: 4;
                           width: 100%; min-width: 0; max-width: 100%; }
    .roles-intro, .row .key { overflow-wrap: anywhere; }
    .fb-sec select { min-width: 0; max-width: 100%; }
    .fb-entry select { max-width: 100%; }
    .cy-sec select, .cy-sec input[type=text] { min-width: 0; max-width: 100%; }
    .cy-bind { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="hdr">
  <h1 id="h1">omp 设置中心</h1>
  <div class="lang-switch" title="切换界面语言 / Switch UI language">
    <button id="lang-zh" class="active">中文</button><button id="lang-en">EN</button>
  </div>
</div>
<div class="sub" id="cfg"></div>
<div class="tabs">
  <button id="tab-roles" class="active">模型角色</button>
  <button id="tab-settings">全部设置</button>
  <button id="tab-models">模型显示</button>
  <button id="tab-usage">用量</button>
  <button id="tab-accounts">账号</button>
</div>
<div id="view-roles"></div>
<div id="view-settings" style="display:none">
  <div class="toolbar">
    <input type="text" id="q" placeholder="搜索：键名 / 中文名 / 描述…">
    <label><input type="checkbox" id="onlyCustom"><span id="only-custom-text">只看已自定义</span></label>
    <span class="count" id="count"></span>
  </div>
  <div class="settings-layout">
    <nav id="group-nav"></nav>
    <div id="settings"></div>
  </div>
</div>
<div id="view-models" style="display:none">
  <div class="vm-note" id="vm-note"></div>
  <div class="toolbar">
    <input type="text" id="vm-q" placeholder="">
    <span class="count" id="vm-count"></span>
  </div>
  <div id="vm-box"></div>
  <div class="vm-bar">
    <button id="vm-save"></button>
    <button id="vm-reset" class="ghost"></button>
    <span class="dirty" id="vm-dirty"></span>
  </div>
</div>
<div id="view-usage" style="display:none">
  <div class="toolbar">
    <button id="u-refresh"></button>
    <button id="u-force" class="ghost"></button>
    <label><input type="checkbox" id="u-auto"><span id="u-auto-text"></span></label>
    <span class="count" id="u-updated"></span>
  </div>
  <div id="u-box"></div>
</div>
<div id="view-accounts" style="display:none">
  <div class="toolbar">
    <button id="a-refresh"></button>
    <span class="count" id="a-updated"></span>
  </div>
  <div id="a-box"></div>
</div>
<div id="toast"></div>
<script>
let models = [], settingsCache = [], visibleSet = new Set();

/* ---------- i18n：中英文切换 ---------- */
const MACRO_GROUP_EN = {"AST 工具":"AST Tools","Git 与提交":"Git & Commits","会话与交互":"Session & Interaction",
  "供应商与认证":"Providers & Auth","协作与分享":"Collaboration & Sharing","安全与遥测":"Security & Telemetry",
  "开发与调试":"Development & Debugging","技能与自动学习":"Skills & Auto Learning","检索与读取":"Retrieval & Reading",
  "界面与输入":"UI & Input","系统与更新":"System & Update","记忆系统":"Memory Systems","语音":"Voice"};
const T = {
  zh: {
    title: 'omp 设置中心',
    tabRoles: '模型角色', tabSettings: '全部设置',
    searchPh: '搜索：键名 / 中文名 / 描述…',
    onlyCustom: '只看已自定义',
    modelsAvail: n => `共 ${n} 个可用模型`,
    roleComment: {"default":"主会话模型","smol":"轻量快速任务","slow":"深度推理",
      "plan":"规划模式","vision":"图像理解","task":"子代理","commit":"提交信息生成",
      "tiny":"极小分类/标题","web":"网络搜索","advisor":"顾问评审"},
    rolesIntro: '「模型角色」是 omp 的模型分工表：不同功能各自绑定一个角色，每个角色再指向具体模型（写法是 供应商/模型名，可带 :high 等思考档位）。角色的值里可以写 @角色名 来引用另一个角色（如 plan: "@slow"），写 * 等价于 @default；也可写逗号分隔的多个候选，取第一个能用的。没有内置说明的名字（如 e）是自定义角色：不影响任何内置功能，只有当你的配置、提示词或扩展用 @名字 引用它时才生效；把名字加进 cycleOrder 可以让 Ctrl+P 轮换到它。',
    roleDesc: {
      "default": '主对话模型：你在会话里敲的每轮对话、主 agent 的所有工具调用都走它，也是大多数角色找不到配置时的最终兜底。务必配一个可靠的主力模型。不配时用启动时选中的模型。',
      "smol": '轻量快速任务模型：自动生成会话标题、给子代理起名、内置机械任务代理 sonic、编辑失败后的自动修复、生成技能描述、/prewalk 一次性交接（先用主模型规划、真正动手写文件时切到它）、/cleanse 清理、--plan-yolo-into 等都用它。适合快而便宜的模型（flash/mini 级）；配太强浪费钱，配太弱会拉低标题和子代理质量。不配时：若 default 已配置则直接用 default，否则按内置快模型优先级表挑。',
      "slow": '深度思考模型：Advisor（顾问评审）没单独配模型时会用到这里；也是 Ctrl+P 模型轮换的一档（默认轮换顺序 smol → default → slow）；启动时可用 --slow 或环境变量 PI_SLOW_MODEL 临时覆盖。建议配旗舰推理模型——它决定顾问评审的质量。不配时：若 default 已配置则直接用 default，否则按内置旗舰模型优先级表挑。',
      "plan": '规划模式的专用模型：输入 /plan 或按 Alt+Shift+P 进入规划模式时切到它，退出时切回（还有「每个新会话自动进入规划模式」的设置项）。适合架构规划能力强的模型。不配时规划模式直接沿用当前会话模型。也可用 --plan / PI_PLAN_MODEL 临时覆盖。',
      "vision": '看图模型：当你拖进图片或对图片提问（如 read screenshot.png 带问题）时，omp 依次尝试 vision → default → 当前会话模型 → 任意能看图的可用模型，取第一个支持图片输入的。要配能看图的模型；配了不支持图片输入的会被跳过，全部都不行时会报错提示你给 vision 配一个。不配时按上述链自动找能看图的模型。',
      "task": 'task 子代理工具的默认模型：主 agent 用 task 工具把工作分给子代理（如内置的通用代理 task），没写死模型的子代理就走它。子代理要独立完成真实工作（读写文件、跑命令），适合稳定的中强模型；配太弱委派的活容易失败。不配时子代理回落到当前会话模型。',
      "commit": '生成 git 提交信息的模型：执行 omp commit（/commit）起草 commit message 时用它。小活，快而便宜的模型最合适。不配时自动回退到 smol，再没有就走 default。',
      "tiny": '极轻量后台模型：自动生成会话标题、语音播报前的文本润色等打杂任务用它，选最小最快的模型即可（本地小模型也行）。不配时回退到 smol（smol 再不配则沿用 default / 内置快模型表）。',
      "web": '联网搜索后端：web_search 等搜索工具用哪个服务/模型由它定。可以绑专用搜索服务（如 web/exa、web/duckduckgo、web/hosted），也可以绑自带联网搜索能力的聊天模型（如 google-gemini-cli/gemini-2.5-flash，会真的用它做搜索）。绑了不支持联网的普通聊天模型会报错并自动尝试内置搜索服务。不配时按内置搜索服务优先级表走。',
      "advisor": '顾问评审模型：开启 advisor.enabled 或在会话里 /advisor on 后，一个后台助手持续审查主 agent 的每轮输出并插话提建议；WATCHDOG.yml 里没写 model 的顾问条目也用它。要配强模型——它得能发现主模型的错。不配时：先用 slow 的配置；slow 也没配则按内置旗舰模型表挑；不会直接用当前会话模型。',

  const spaced = last.replace(/([a-z0-9])([A-Z])/g, '$1 $2');
  return spaced.charAt(0).toUpperCase() + spaced.slice(1);
}
function buildGroupEn(groupsZh, groupsEn) {
  zhGroupEn = {};
  for (const id in groupsZh) if (groupsEn[id]) zhGroupEn[groupsZh[id]] = groupsEn[id];
}

function rerenderDynamic() { // 不整页重载：重渲染两个页签的动态内容
  load();
  if (settingsCache.length) { renderNav(hitsByGroup()); renderGroup(); }
  if (vm.models.length) renderModels();

  rerenderDynamic();
}
document.getElementById('lang-zh').onclick = () => setLang('zh');
document.getElementById('lang-en').onclick = () => setLang('en');

/* ---------- 通用 ---------- */
function toast(msg, bad) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  t.className = bad ? 'bad' : '';
  setTimeout(() => t.style.display = 'none', 4000);
}
document.getElementById('tab-roles').onclick = () => switchTab('roles');
document.getElementById('tab-settings').onclick = () => switchTab('settings');
document.getElementById('tab-models').onclick = () => switchTab('models');
document.getElementById('tab-usage').onclick = () => switchTab('usage');
document.getElementById('tab-accounts').onclick = () => switchTab('accounts');
function switchTab(which) {
  for (const v of ['roles', 'settings', 'models', 'usage', 'accounts']) {
    document.getElementById('tab-' + v).classList.toggle('active', which === v);
    document.getElementById('view-' + v).style.display = which === v ? '' : 'none';
  }
  if (which === 'accounts') loadAccounts();
  if (which === 'settings' && !document.getElementById('settings').childElementCount) loadSettings();
  if (which === 'models') loadModels();
  if (which === 'usage') { loadUsage(); startUsageTimer(); } else stopUsageTimer();
}

/* ---------- 模型角色 ---------- */
async function load() {
  const r = await fetch('/api/state').then(x => x.json());
  models = r.models;
  visibleSet = new Set(r.visible || r.models.map(m => m.selector));
  document.getElementById('cfg').textContent = r.config + ' · ' + t().modelsAvail(r.models.length);
  const box = document.getElementById('view-roles');
  box.innerHTML = '';
  const intro = document.createElement('div');
  intro.className = 'roles-intro';
  intro.textContent = t().rolesIntro;
  box.appendChild(intro);
  for (const [role, value] of Object.entries(r.roles)) {
    box.appendChild(roleRow(role, value));
  }
  fb.roles = Object.keys(r.roles);
  try {
    const fr = await fetch('/api/fallback').then(x => x.json());
    if (fr && fr.error) { fb.err = fr.error; fb.data = null; toast(t().failed(fr.error), true); }
    else { fb.err = null; fb.data = fr; }
  } catch (e) {
    fb.err = String(e.message || e); fb.data = null;
    toast(t().failed(fb.err), true);
  }
  await loadCycle(r.roles);
  renderCycle(box);
  renderFallback(box);
}

function roleRow(role, value) {
  const div = document.createElement('div');
  div.className = 'role';
  const groups = {};
  for (const m of models)  // 只列「模型显示」中可见的模型；当前值即使被隐藏也保留
    if (visibleSet.has(m.selector) || m.selector === value) (groups[m.provider] ??= []).push(m);
  const gsel = document.createElement('select');
  gsel.className = 'group';
  for (const [p, list] of Object.entries(groups).sort((a,b)=>a[0].localeCompare(b[0]))) {
    const o = document.createElement('option');
    o.value = p;
    o.textContent = `${p} (${list.length})`;
    gsel.appendChild(o);
  }
  const inCatalog = models.some(m => m.selector === value);
  if (!inCatalog) {
    const o = document.createElement('option');
    o.value = '__current__';
    o.textContent = t().currentOpt(value);
    gsel.prepend(o);
  }
  const msel = document.createElement('select');
  function fillModels(group) {
    msel.innerHTML = '';
    const list = group === '__current__' ? [] : groups[group] || [];
    for (const m of list) {
      const o = document.createElement('option');
      o.value = m.selector;
      o.textContent = m.name + '  (' + m.selector + ')';
      msel.appendChild(o);
    }
    if (group === '__current__') {
      const o = document.createElement('option');
      o.value = value; o.textContent = value; o.selected = true;
      msel.appendChild(o);
    }
  }
  gsel.onchange = () => fillModels(gsel.value);
  gsel.value = inCatalog ? (models.find(m => m.selector === value)?.provider ?? Object.keys(groups)[0])
                         : '__current__';
  fillModels(gsel.value);
  if (inCatalog) msel.value = value;
  div.innerHTML = `<div class="name"><span class="rname"></span><small></small></div>
                   <div class="rdesc"></div>
                   <div class="value"></div>`;
  div.querySelector('.rname').textContent = role;
  div.querySelector('.name small').textContent = t().roleComment[role] || '';
  const desc = t().roleDesc[role] || t().roleDescFallback.replace(/%s/g, role);
  div.querySelector('.rdesc').textContent = desc;
  div.querySelector('.value').textContent = value;
  const edit = document.createElement('button');
  edit.textContent = t().switchBtn;
  edit.onclick = () => {
    div.classList.add('editing');
    div.append(gsel, msel);
    edit.style.display = 'none';
    const ok = document.createElement('button'); ok.textContent = t().saveBtn;
    const no = document.createElement('button'); no.textContent = t().cancelBtn; no.className = 'ghost';
    ok.onclick = async () => {
      const r = await fetch('/api/set', {method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({role, value: msel.value})}).then(x => x.json());
      toast(r.ok ? t().roleSaved(role, msel.value) : t().failed(r.error), !r.ok);
      load();
    };
    no.onclick = () => load();
    div.append(ok, no);
  };
  div.appendChild(edit);
  return div;
}

/* ---------- 故障兜底（retry.fallbackChains） ---------- */
const fb = { data: null, err: null, roles: [] };
const FB_THINK = ['', 'low', 'medium', 'high', 'xhigh', 'max', 'off'];
const FB_KIND = { // 模型种类角色：用自己的链，不走 default
  image: 1, web: 1, speech: 1, dictation: 1, judge: 1, memory: 1 };

function fbSplit(e) { // 条目 = 基础选择器 + 可选 :思考档
  const i = e.lastIndexOf(':');
  if (i > 0 && FB_THINK.includes(e.slice(i + 1)))
    return { base: e.slice(0, i), th: e.slice(i + 1) };
  return { base: e, th: '' };
}
function fbProviders() { // 新选项只来自当前可见模型；既有失效条目由各行单独保留
  const g = {};
  for (const m of models) if (visibleSet.has(m.selector)) (g[m.provider] ??= []).push(m);
  return g;
}
function fbOpt(sel, value, label) {
  const o = document.createElement('option');
  o.value = value; o.textContent = label; sel.appendChild(o); return o;
}

function fbState(chain) {
  return chain === undefined ? 'unset' : (chain.length === 0 ? 'empty' : 'custom');
}
function fbBadge(chain) {
  const st = fbState(chain);
  const b = document.createElement('span');
  b.className = 'badge ' + (st === 'unset' ? 'default' : st === 'empty' ? 'ro' : 'custom');
  b.textContent = st === 'unset' ? t().fbStUnset : st === 'empty' ? t().fbStEmpty : t().fbStCustom;
  return b;
}

function fbScalarRow(label, hint, key, value, options) { // 标量项走 /api/set-key
  const div = document.createElement('div');
  div.className = 'row';
  div.dataset.setting = key;
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = `<span class="zhname"></span><span class="key"></span>`;
  head.querySelector('.zhname').textContent = label;
  head.querySelector('.key').textContent = key;
  const sel = document.createElement('select');
  sel.setAttribute('aria-label', label);
  for (const [v, lab] of options) fbOpt(sel, v, lab).selected = (v === value);
  head.appendChild(sel);
  const save = document.createElement('button');
  save.className = 'save'; save.textContent = t().saveBtn;
  save.onclick = async () => {
    save.disabled = true;
    try {
      const r = await fetch('/api/set-key', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({key, value: sel.value})}).then(x => x.json());
      if (r.ok) { toast(t().keySaved(key, sel.value)); await load(); }
      else toast(t().failed(r.error), true);
    } catch (e) {
      toast(t().failed(e.message || e), true);
    } finally { save.disabled = false; }
  };
  head.appendChild(save);
  div.appendChild(head);
  const d = document.createElement('div');
  d.className = 'desc'; d.textContent = hint;
  div.appendChild(d);
  return div;
}

function fbEntryEditor(wchain, i, refresh) { // 单条链条目编辑行
  const cur = fbSplit(wchain[i]);
  const groups = fbProviders();
  const row = document.createElement('div');
  row.className = 'fb-entry';
  const ord = document.createElement('span');
  ord.className = 'ord'; ord.textContent = String(i + 1);
  const psel = document.createElement('select');
  const msel = document.createElement('select');
  const tsel = document.createElement('select');
  const curProv = cur.base.split('/')[0];
  psel.setAttribute('aria-label', LANG === 'zh' ? '供应商' : 'Provider');
  msel.setAttribute('aria-label', LANG === 'zh' ? '备用模型' : 'Fallback model');
  tsel.setAttribute('aria-label', LANG === 'zh' ? '思考强度' : 'Thinking level');
  const knownProv = curProv in groups;
  for (const p of Object.keys(groups).sort()) fbOpt(psel, p, p);
  if (!knownProv) fbOpt(psel, '__raw__', t().currentOpt(curProv)).selected = true;
  else psel.value = curProv;
  function fillM() {
    msel.innerHTML = '';
    if (psel.value === '__raw__') { fbOpt(msel, cur.base, cur.base); return; }
    const p = psel.value;
    if (cur.base === p + '/*') fbOpt(msel, cur.base, t().currentOpt(cur.base));
    for (const m of groups[p] || []) fbOpt(msel, m.selector, m.name + '  (' + m.selector + ')');
    const want = cur.base.startsWith(p + '/') ? cur.base : (groups[p] || [])[0]?.selector;
    if (want && ![...msel.options].some(o => o.value === want))
      fbOpt(msel, want, t().currentOpt(want)); // 隐藏/不在目录的既有条目保留
    msel.value = want;
  }
  psel.onchange = () => { fillM(); upd(); };
  for (const th of FB_THINK) fbOpt(tsel, th, th === '' ? t().fbInherit : ':' + th);
  tsel.value = cur.th;
  if (![...tsel.options].some(o => o.value === cur.th)) { // 未知后缀原样保留
    fbOpt(tsel, cur.th, t().currentOpt(cur.th)).selected = true;
  }
  function upd() {
    const base = psel.value === '__raw__' ? cur.base : msel.value;
    wchain[i] = base + (tsel.value ? ':' + tsel.value : '');
  }
  msel.onchange = upd; tsel.onchange = upd;
  fillM();
  const up = document.createElement('button'); up.className = 'ghost'; up.textContent = '↑';
  const dn = document.createElement('button'); dn.className = 'ghost'; dn.textContent = '↓';
  const del = document.createElement('button'); del.className = 'ghost'; del.textContent = '✕';
  up.setAttribute('aria-label', LANG === 'zh' ? '上移' : 'Move up');
  dn.setAttribute('aria-label', LANG === 'zh' ? '下移' : 'Move down');
  del.setAttribute('aria-label', LANG === 'zh' ? '删除' : 'Remove');
  up.disabled = i === 0; dn.disabled = i === wchain.length - 1;
  up.onclick = () => { [wchain[i-1], wchain[i]] = [wchain[i], wchain[i-1]]; refresh(); };
  dn.onclick = () => { [wchain[i+1], wchain[i]] = [wchain[i], wchain[i+1]]; refresh(); };
  del.onclick = () => { wchain.splice(i, 1); refresh(); };
  row.append(ord, psel, msel, tsel, up, dn, del);
  return row;
}

function fbChainRow(key) {
  const chains = fb.data ? fb.data.chains || {} : {};
  const chain = chains[key];
  const isRole = fb.roles.includes(key);
  const kind = isRole ? 'role' : (key.includes('*') ? 'wild' : 'model');
  const div = document.createElement('div');
  div.className = 'row';
  div.dataset.chainKey = key;
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = `<span class="zhname"></span><span class="key"></span>`;
  head.querySelector('.zhname').textContent = isRole
    ? key + (t().roleComment[key] ? ' · ' + t().roleComment[key] : '')
    : key;
  head.querySelector('.key').textContent = 'retry.fallbackChains.' + key;
  const kt = document.createElement('span');
  kt.className = 'badge default';
  kt.textContent = kind === 'role' ? t().fbKeyRole : kind === 'wild' ? t().fbKeyWild : t().fbKeyModel;
  head.append(kt, fbBadge(chain));
  const edit = document.createElement('button');
  edit.className = 'save'; edit.textContent = t().switchBtn;
  head.appendChild(edit);
  div.appendChild(head);
  const view = document.createElement('div');
  view.className = 'desc';
  const eff = document.createElement('span');
  eff.style.marginRight = '8px';
  const st = fbState(chain);
  eff.textContent = st === 'unset'
    ? (key === 'default' || FB_KIND[key] ? t().fbStUnset : t().fbEffUnset)
    : st === 'empty' ? t().fbEffEmpty : '';
  const vw = document.createElement('span');
  vw.className = 'fb-view';
  vw.textContent = chain ? (chain.length ? chain.join('  →  ') : '[]') : '';
  view.append(eff, vw);
  div.appendChild(view);

  const ed = document.createElement('div');
  ed.className = 'fb-ed'; ed.style.display = 'none';
  div.appendChild(ed);

  let wmode = st;
  let wchain = chain ? chain.slice() : [];
  function renderEd() {
    ed.innerHTML = '';
    const msel = document.createElement('select');
    msel.className = 'fb-mode';
    msel.setAttribute('aria-label', LANG === 'zh' ? '兜底模式' : 'Fallback mode');
    for (const [v, lab] of [['unset', t().fbModeUnset],
                           ['empty', t().fbModeEmpty],
                           ['custom', t().fbModeCustom]]) fbOpt(msel, v, lab);
    msel.value = wmode;
    msel.onchange = () => { wmode = msel.value; renderEd(); };
    ed.appendChild(msel);
    if (wmode === 'custom') {
      wchain.forEach((_, i) => ed.appendChild(fbEntryEditor(wchain, i, renderEd)));
      const add = document.createElement('button');
      add.className = 'ghost u-mini'; add.textContent = t().fbAdd;
      add.disabled = !Object.values(fbProviders()).some(list => list.length);
      add.onclick = () => {
        const gs = fbProviders();
        const p = Object.keys(gs).sort().find(p => gs[p].length);
        const first = p && gs[p][0];
        if (!first) return;
        wchain.push(first.selector);
        renderEd();
      };
      ed.appendChild(add);
    }
    const ops = document.createElement('div');
    ops.className = 'fb-ops';
    const ok = document.createElement('button'); ok.textContent = t().saveBtn;
    const no = document.createElement('button'); no.textContent = t().cancelBtn; no.className = 'ghost';
    ok.onclick = async () => {
      const payload = wmode === 'unset' ? null : wmode === 'empty' ? [] : wchain.slice();
      if (wmode === 'custom' && (!wchain.length || wchain.some(s => !s || !s.includes('/')))) {
        toast(LANG === 'zh' ? '自定义链至少需要一个明确的备用模型；禁用兜底请选择显式禁用。'
                           : 'Choose at least one fallback model, or explicitly disable fallback.', true);
        return;
      }
      ok.disabled = true;
      try {
        const r = await fetch('/api/fallback', {method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({key, chain: payload})}).then(x => x.json());
        if (r.ok) {
          fb.data.chains = fb.data.chains || {};
          if (payload === null) delete fb.data.chains[key]; else fb.data.chains[key] = payload;
          toast(t().fbSaved(key));
          renderFallback(document.getElementById('view-roles'));
        } else toast(t().failed(r.error), true);
      } catch (e) {
        toast(t().failed(e.message || e), true);
      } finally { ok.disabled = false; }
    };
    no.onclick = () => { // 取消：回到已保存状态
      wmode = fbState((fb.data.chains || {})[key]);
      wchain = ((fb.data.chains || {})[key] || []).slice();
      ed.style.display = 'none'; ed.innerHTML = '';
    };
    ops.append(ok, no);
    ed.appendChild(ops);
  }
  edit.onclick = () => {
    if (ed.style.display === 'none') {
      wmode = fbState(chain); wchain = chain ? chain.slice() : [];
      ed.style.display = ''; renderEd();
    } else { ed.style.display = 'none'; ed.innerHTML = ''; }
  };
  return div;
}

function renderFallback(box) {
  const old = box.querySelector('.fb-sec');
  if (old) old.remove();
  const sec = document.createElement('div');
  sec.className = 'fb-sec';
  const h = document.createElement('div');
  h.className = 'grp';
  h.innerHTML = `<span class="grp-name"></span><small>retry.fallbackChains</small>`;
  h.querySelector('.grp-name').textContent = t().fbTitle;
  sec.appendChild(h);
  if (!fb.data) { // 读取失败：显示错误而不是空链
    const e = document.createElement('div');
    e.className = 'empty-hint';
    e.textContent = t().fbLoadFailed + (fb.err ? ': ' + fb.err : '');
    sec.appendChild(e);
    box.appendChild(sec);
    return;
  }
  const intro = document.createElement('div');
  intro.className = 'roles-intro';
  intro.textContent = t().fbIntro;
  sec.appendChild(intro);
  const d = fb.data;
  sec.appendChild(fbScalarRow(t().fbMF, t().fbMFHint, 'retry.modelFallback',
    String(d.modelFallback !== false), [['true', t().boolLabel('true')], ['false', t().boolLabel('false')]]));
  sec.appendChild(fbScalarRow(t().fbOn, '', 'retry.fallbackOn',
    d.fallbackOn || 'any', [['any', t().fbOnAny], ['usage-limit', t().fbOnLimit],
                            ['except-usage-limit', t().fbOnExcept]]));
  sec.appendChild(fbScalarRow(t().fbRev, '', 'retry.fallbackRevertPolicy',
    d.fallbackRevertPolicy || 'cooldown-expiry',
    [['cooldown-expiry', t().fbRevCooldown], ['never', t().fbRevNever]]));
  const chains = d.chains || {};
  const keys = fb.roles.slice();
  for (const k of Object.keys(chains)) if (!keys.includes(k)) keys.push(k);
  for (const k of keys) sec.appendChild(fbChainRow(k));
  box.appendChild(sec);
}

/* ---------- Ctrl+P 轮换顺序（cycleOrder） ---------- */
const cy = { saved: null, draft: null, custom: false, def: [], err: null, roles: {} };
const CY_ROLE = /^[A-Za-z0-9_][A-Za-z0-9_.\-]*$/;
const cySame = (a, b) => JSON.stringify(a) === JSON.stringify(b);

async function loadCycle(roles) {
  cy.roles = roles;
  try {
    const r = await fetch('/api/cycle-order').then(x => x.json());
    if (r.error) throw new Error(r.error);
    const keepDraft = cy.saved && cy.draft && !cySame(cy.draft, cy.saved); // 绑定模型后重载时保留未保存草稿
    cy.saved = r.order; cy.custom = r.custom; cy.def = r.default; cy.err = null;
    if (!keepDraft) cy.draft = r.order.slice();
  } catch (e) {
    cy.err = String(e.message || e); cy.saved = null;
    toast(t().failed(cy.err), true);
  }
}

async function cyPost(order) {
  try {
    const r = await fetch('/api/cycle-order', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({order})}).then(x => x.json());
    if (!r.ok) { toast(t().failed(r.error), true); return false; }
    cy.saved = r.order; cy.custom = r.custom; cy.draft = r.order.slice();
    return true;
  } catch (e) {
    toast(t().failed(e.message || e), true);
    return false;
  }
}

function cyBindEditor(role, onCancel) { // 为未绑定的（自定义）角色选择模型，写 modelRoles
  const wrap = document.createElement('div');
  wrap.className = 'cy-bind';
  const groups = fbProviders();
  const psel = document.createElement('select');
  const msel = document.createElement('select');
  psel.setAttribute('aria-label', t().cyProvider);
  msel.setAttribute('aria-label', t().cyModel);
  for (const p of Object.keys(groups).sort()) if (groups[p].length) fbOpt(psel, p, `${p} (${groups[p].length})`);
  const fill = () => {
    msel.innerHTML = '';
    for (const m of groups[psel.value] || []) fbOpt(msel, m.selector, m.name + '  (' + m.selector + ')');
  };
  psel.onchange = fill; fill();
  const ok = document.createElement('button'); ok.textContent = t().saveBtn;
  const no = document.createElement('button'); no.textContent = t().cancelBtn; no.className = 'ghost';
  ok.disabled = !msel.value;
  ok.onclick = async () => {
    ok.disabled = true;
    try {
      const r = await fetch('/api/set', {method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({role, value: msel.value})}).then(x => x.json());
      toast(r.ok ? t().roleSaved(role, msel.value) : t().failed(r.error), !r.ok);
      if (r.ok) await load(); else ok.disabled = false;
    } catch (e) {
      toast(t().failed(e.message || e), true);
      ok.disabled = false;
    }
  };
  no.onclick = () => { wrap.remove(); onCancel(); };
  wrap.append(psel, msel, ok, no);
  return wrap;
}

function cyEntry(role, i) {
  const row = document.createElement('div');
  row.className = 'fb-entry';
  row.dataset.cycleRole = role;
  const ord = document.createElement('span');
  ord.className = 'ord'; ord.textContent = String(i + 1);
  const name = document.createElement('span');
  name.className = 'cy-name'; name.textContent = role;
  row.append(ord, name);
  const model = cy.roles[role];
  if (model) {
    const v = document.createElement('span');
    v.className = 'fb-view'; v.textContent = model;
    row.appendChild(v);
  } else {
    const w = document.createElement('span');
    w.className = 'cy-warn'; w.textContent = t().cyUnbound;
    const bind = document.createElement('button');
    bind.className = 'ghost u-mini'; bind.textContent = t().cyBind;
    bind.onclick = () => { bind.disabled = true; row.appendChild(cyBindEditor(role, () => { bind.disabled = false; })); };
    row.append(w, bind);
  }
  const d = cy.draft;
  const mk = (text, label, disabled, fn) => {
    const b = document.createElement('button');
    b.className = 'ghost'; b.textContent = text; b.disabled = disabled;
    b.setAttribute('aria-label', label); b.title = label;
    b.onclick = () => { fn(); cyRerender(); };
    return b;
  };
  row.append(
    mk('↑', t().cyUp, i === 0, () => { [d[i - 1], d[i]] = [d[i], d[i - 1]]; }),
    mk('↓', t().cyDown, i === d.length - 1, () => { [d[i + 1], d[i]] = [d[i], d[i + 1]]; }),
    mk('✕', t().cyRemove, false, () => { d.splice(i, 1); }));
  return row;
}

function cyRerender() { renderCycle(document.getElementById('view-roles')); }

function renderCycle(box) {
  const sec = document.createElement('div');
  sec.className = 'cy-sec';
  const h = document.createElement('div');
  h.className = 'grp';
  h.innerHTML = '<span class="grp-name"></span><small>cycleOrder</small>';
  h.querySelector('.grp-name').textContent = t().cyTitle;
  sec.appendChild(h);
  const old = box.querySelector('.cy-sec');
  const place = () => {
    if (old) old.replaceWith(sec);
    else { const f = box.querySelector('.fb-sec'); f ? box.insertBefore(sec, f) : box.appendChild(sec); }
  };
  if (!cy.saved) { // 读取失败：显示错误，不给编辑器
    const e = document.createElement('div');
    e.className = 'empty-hint';
    e.textContent = t().cyLoadFailed + (cy.err ? ': ' + cy.err : '');
    sec.appendChild(e);
    place();
    return;
  }
  const intro = document.createElement('div');
  intro.className = 'roles-intro';
  intro.textContent = t().cyIntro(cy.def.join(' → '));
  sec.appendChild(intro);

  const card = document.createElement('div');
  card.className = 'row';
  const head = document.createElement('div');
  head.className = 'head';
  const title = document.createElement('span');
  title.className = 'zhname'; title.textContent = t().cyCurrent;
  const badge = document.createElement('span');
  badge.className = 'badge ' + (cy.custom ? 'custom' : 'default');
  badge.textContent = cy.custom ? t().cyStCustom : t().cyStDefault;
  head.append(title, badge);
  card.appendChild(head);

  cy.draft.forEach((role, i) => card.appendChild(cyEntry(role, i)));
  if (!cy.draft.length) {
    const e = document.createElement('div');
    e.className = 'desc cy-warn'; e.textContent = t().cyEmpty;
    card.appendChild(e);
  }

  const add = document.createElement('div');
  add.className = 'cy-add';
  const avail = Object.keys(cy.roles).filter(r => !cy.draft.includes(r));
  const rsel = document.createElement('select');
  rsel.setAttribute('aria-label', t().cyAddRole);
  for (const r of avail) fbOpt(rsel, r, cy.roles[r] ? `${r}  (${cy.roles[r]})` : r);
  if (!avail.length) fbOpt(rsel, '', t().cyNoRoles);
  rsel.disabled = !avail.length;
  const addRole = document.createElement('button');
  addRole.className = 'ghost u-mini'; addRole.textContent = t().cyAddRole;
  addRole.disabled = !avail.length;
  addRole.onclick = () => { cy.draft.push(rsel.value); cyRerender(); };
  const input = document.createElement('input');
  input.type = 'text'; input.placeholder = t().cyCustomPh;
  input.setAttribute('aria-label', t().cyCustomPh);
  const addCustom = document.createElement('button');
  addCustom.className = 'ghost u-mini'; addCustom.textContent = t().cyAddCustom;
  addCustom.onclick = () => {
    const name = input.value.trim();
    if (!CY_ROLE.test(name)) { toast(t().cyBadName, true); return; }
    if (cy.draft.includes(name)) { toast(t().cyDup(name), true); return; }
    cy.draft.push(name); cyRerender();
  };
  input.onkeydown = e => { if (e.key === 'Enter') addCustom.click(); };
  add.append(rsel, addRole, input, addCustom);
  card.appendChild(add);

  const dirty = !cySame(cy.draft, cy.saved);
  const ops = document.createElement('div');
  ops.className = 'fb-ops';
  const save = document.createElement('button'); save.textContent = t().saveBtn;
  save.disabled = !dirty || !cy.draft.length;
  save.onclick = async () => {
    save.disabled = true;
    if (await cyPost(cy.draft.slice())) { toast(t().cySaved); cyRerender(); }
    else save.disabled = false;
  };
  const cancel = document.createElement('button');
  cancel.className = 'ghost'; cancel.textContent = t().cancelBtn;
  cancel.disabled = !dirty;
  cancel.onclick = () => { cy.draft = cy.saved.slice(); cyRerender(); };
  const reset = document.createElement('button');
  reset.className = 'ghost'; reset.textContent = t().cyReset;
  reset.disabled = !cy.custom;
  reset.onclick = async () => {
    if (!confirm(t().cyResetConfirm(cy.def.join(' → ')))) return;
    reset.disabled = true;
    if (await cyPost(null)) { toast(t().cyResetDone); cyRerender(); }
    else reset.disabled = false;
  };
  const note = document.createElement('span');
  note.className = 'cy-dirty'; note.textContent = dirty ? t().cyDirty : '';
  ops.append(save, cancel, reset, note);
  card.appendChild(ops);
  sec.appendChild(card);
  place();
}

/* ---------- 全部设置 ---------- */
let curGroup = null;        // 当前选中的大类
let preSearchGroup = null;  // 搜索前所在大类，清空搜索时恢复
let groupMap = {};          // __groupmap 语义归组：键或命名空间前缀 → 大类名

function groupNameFor(key, fallback) {
  if (groupMap[key]) return groupMap[key]; // 1) 精确键优先
  let best = null, bestLen = -1;
  for (const p in groupMap) {
    if (key.length > p.length && key[p.length] === '.' &&
        key.startsWith(p) && p.length > bestLen) {
      best = groupMap[p]; bestLen = p.length; // 2) 最长命名空间前缀
    }
  }
  if (best) return best;
  return fallback;                          // 3) 回退 __groups（服务端组名）
}

function groupList() {
  const totals = new Map();
  for (const it of settingsCache) totals.set(it.group, (totals.get(it.group) || 0) + 1);
  return [...totals.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'zh'));
}

function filtered() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const onlyCustom = document.getElementById('onlyCustom').checked;
  return settingsCache.filter(it =>
    (!onlyCustom || it.custom) &&
    (!q || it.key.toLowerCase().includes(q) ||
     (it.name || '').includes(q) || (it.zh || '').includes(q) ||
     (it.desc || '').toLowerCase().includes(q)));
}

function hitsByGroup() {
  const hits = new Map();
  for (const it of filtered()) hits.set(it.group, (hits.get(it.group) || 0) + 1);
  return hits;
}

function isFiltering() {
  return document.getElementById('q').value.trim() !== '' ||
         document.getElementById('onlyCustom').checked;
}

function applyFilter(jump) {
  const searching = document.getElementById('q').value.trim() !== '';
  if (searching && preSearchGroup === null) preSearchGroup = curGroup;
  if (!searching && preSearchGroup !== null) { // 清空搜索 → 回到搜索前的分类
    curGroup = preSearchGroup; preSearchGroup = null;
  }
  const hits = hitsByGroup();
  if (jump && !(hits.get(curGroup) > 0)) {     // 当前分类无命中 → 跳到首个命中的分类
    const first = [...hits.keys()][0];
    if (first) curGroup = first;
  }
  if (!groupList().some(([g]) => g === curGroup)) curGroup = groupList()[0]?.[0] ?? null;
  renderNav(hits);
  renderGroup();
}

async function loadSettings() {
  const r = await fetch('/api/settings').then(x => x.json());
  if (r.error) { toast(r.error, true); return; }
  groupMap = r.groupmap || {};
  buildGroupEn(r.groups || {}, r.groups_en || {});
  settingsCache = r.items;
  for (const it of settingsCache) it.group = groupNameFor(it.key, it.group);
  applyFilter(false);
  document.getElementById('q').oninput = () => applyFilter(true);
  document.getElementById('onlyCustom').onchange = () => applyFilter(true);
}

function renderNav(hits) {
  const filtering = isFiltering();
  const nav = document.getElementById('group-nav');
  nav.innerHTML = '';
  for (const [g, total] of groupList()) {
    const hit = hits.get(g) || 0;
    const d = document.createElement('div');
    d.className = 'nav-item' + (g === curGroup ? ' active' : '') + (filtering && !hit ? ' dim' : '');
    d.title = t().navTitle(groupName(g), total);
    const nm = document.createElement('span');
    nm.className = 'gname'; nm.textContent = groupName(g);
    const c = document.createElement('span');
    c.className = 'cnt'; c.textContent = filtering ? hit : total;
    d.append(nm, c);
    d.onclick = () => { curGroup = g; renderNav(hitsByGroup()); renderGroup(); };
    nav.appendChild(d);
  }
}

function renderGroup() {
  const filtering = isFiltering();
  const box = document.getElementById('settings');
  box.innerHTML = '';
  if (!curGroup) return;
  const rows = filtered().filter(it => it.group === curGroup);
  const total = (groupList().find(([g]) => g === curGroup) || [null, 0])[1];
  const h = document.createElement('div');
  h.className = 'grp';
  h.innerHTML = `<span class="grp-name"></span><small></small>`;
  h.querySelector('.grp-name').textContent = groupName(curGroup);
  h.querySelector('small').textContent = filtering ? t().grpHit(rows.length, total) : t().grpAll(total);
  box.appendChild(h);
  for (const it of rows) box.appendChild(settingRow(it));
  if (!rows.length) {
    const e = document.createElement('div');
    e.className = 'empty-hint';
    e.textContent = t().emptyHint;
    box.appendChild(e);
  }
  document.getElementById('count').textContent = t().count(filtered().length, settingsCache.length);
}

function settingRow(it) {
  const div = document.createElement('div');
  div.className = 'row';
  const head = document.createElement('div');
  head.className = 'head';
  const nameZh = it.name || it.key.split('.').pop();
  const badge = document.createElement('span');
  if (it.custom) { badge.className = 'badge custom'; badge.textContent = t().badgeCustom; }
  else { badge.className = 'badge default'; badge.textContent = t().badgeDefault; }
  if (!it.editable) {
    badge.className = 'badge ro';
    badge.textContent = t().badgeRO;
  }
  head.innerHTML = `<span class="zhname"></span><span class="key"></span>`;
  head.querySelector('.zhname').textContent = LANG === 'zh' ? nameZh : enName(it.key);
  head.querySelector('.key').textContent = it.key;
  head.appendChild(badge);

  let input;
  const cur = it.value === null || it.value === undefined ? '' : String(it.value);
  if (!it.editable) {
    input = document.createElement('input');
    input.type = 'text'; input.disabled = true;
    input.value = it.value === undefined ? t().noneVal : JSON.stringify(it.value);
  } else if (it.type === 'boolean') {
    input = document.createElement('select');
    for (const [v, label] of [['true', t().boolLabel('true')], ['false', t().boolLabel('false')]]) {
      const o = document.createElement('option');
      o.value = v; o.textContent = label;
      if (cur === v) o.selected = true;
      input.appendChild(o);
    }
  } else if (it.options && it.options.length) {
    input = document.createElement('select');
    for (const v of it.options) {
      const o = document.createElement('option');
      o.value = v; o.textContent = v;
      if (cur === v) o.selected = true;
      input.appendChild(o);
    }
    if (![...input.options].some(o => o.value === cur)) {
      const o = document.createElement('option');
      o.value = cur; o.textContent = t().currentSuffix(cur); o.selected = true;
      input.prepend(o);
    }
  } else {
    input = document.createElement('input');
    input.type = 'text';
    input.value = cur;
  }
  head.appendChild(input);

  const save = document.createElement('button');
  save.className = 'save'; save.textContent = t().saveBtn;
  if (!it.editable) save.disabled = true;
  save.onclick = async () => {
    const r = await fetch('/api/set-key', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({key: it.key, value: input.value})}).then(x => x.json());
    if (r.ok) toast(t().keySaved(it.key, input.value));
    else { toast(t().failed(r.error), true); return; }
    const y = window.scrollY;
    await loadSettings();
    window.scrollTo(window.scrollX, y); // 保持滚动位置
  };
  head.appendChild(save);
  div.appendChild(head);

  const desc = document.createElement('div');
  desc.className = 'desc';
  const bits = LANG === 'zh' ? [it.zh || it.key.split('.').pop()]
                             : [it.desc || it.desc_en || enName(it.key)]; // 英文原文，上游为空用 desc_en，再退键名
  bits.push(`${t().typePrefix}: ${t().typeName(it.type)}`);
  desc.textContent = bits.join(' · ');
  desc.title = LANG === 'zh' ? (it.desc || '')          // 悬停见英文原文
                             : [nameZh, it.zh].filter(Boolean).join('\n'); // 悬停见中文
  div.appendChild(desc);
  return div;
}

/* ---------- 模型显示（enabledModels） ---------- */
const vm = { models: [], saved: new Set(), sel: new Set(), def: null, managed: true, open: new Set() };

async function loadModels() {
  const r = await fetch('/api/visibility').then(x => x.json());
  if (r.error) { toast(t().failed(r.error), true); return; }
  applyVisibility(r);
}
function applyVisibility(r) {
  vm.models = r.models; vm.def = r.default; vm.managed = r.managed;
  vm.saved = new Set(r.visible); vm.sel = new Set(r.visible);
  renderModels();
}
function vmDiff() {
  let n = 0;
  for (const s of vm.sel) if (!vm.saved.has(s)) n++;
  for (const s of vm.saved) if (!vm.sel.has(s)) n++;
  return n;
}
function vmStatus() {
  document.getElementById('vm-count').textContent = t().vmCount(vm.sel.size, vm.models.length);
  const d = vmDiff();
  document.getElementById('vm-dirty').textContent = d ? t().vmDirty(d) : '';
  document.getElementById('vm-save').disabled = !vm.managed || d === 0 || vm.sel.size === 0;
  document.getElementById('vm-reset').disabled = d === 0;
}
function renderModels() {
  document.getElementById('vm-note').textContent = vm.managed ? t().vmNote : t().vmUnmanaged;
  const q = document.getElementById('vm-q').value.trim().toLowerCase();
  const box = document.getElementById('vm-box');
  box.innerHTML = '';
  const groups = {};
  for (const m of vm.models) {
    if (q && !`${m.provider} ${m.name} ${m.selector}`.toLowerCase().includes(q)) continue;
    (groups[m.provider] ??= []).push(m);
  }
  for (const [p, list] of Object.entries(groups).sort((a, b) => a[0].localeCompare(b[0]))) {
    const wrap = document.createElement('div');
    wrap.className = 'vm-prov' + (q || vm.open.has(p) ? ' open' : '');
    const head = document.createElement('div');
    head.className = 'vm-head';
    const total = vm.models.filter(m => m.provider === p).length;
    const on = vm.models.filter(m => m.provider === p && vm.sel.has(m.selector)).length;
    const pbox = document.createElement('input');
    pbox.type = 'checkbox'; pbox.disabled = !vm.managed;
    pbox.checked = on === total; pbox.indeterminate = on > 0 && on < total;
    pbox.onclick = e => e.stopPropagation();
    pbox.onchange = () => {
      for (const m of list) if (m.selector !== vm.def) pbox.checked ? vm.sel.add(m.selector) : vm.sel.delete(m.selector);
      renderModels();
    };
    head.innerHTML = `<span class="caret">${wrap.classList.contains('open') ? '▾' : '▸'}</span>`;
    head.appendChild(pbox);
    const name = document.createElement('span'); name.className = 'pname'; name.textContent = p;
    const cnt = document.createElement('span'); cnt.className = 'pcnt'; cnt.textContent = `${on} / ${total}`;
    head.append(name, cnt);
    for (const [label, on] of [[t().vmAll, true], [t().vmNone, false]]) {
      const b = document.createElement('button');
      b.textContent = label; b.disabled = !vm.managed;
      b.onclick = e => {
        e.stopPropagation();
        for (const m of vm.models) if (m.provider === p && m.selector !== vm.def) on ? vm.sel.add(m.selector) : vm.sel.delete(m.selector);
        renderModels();
      };
      head.appendChild(b);
    }
    head.onclick = () => { vm.open.has(p) ? vm.open.delete(p) : vm.open.add(p); renderModels(); };
    const ul = document.createElement('div');
    ul.className = 'vm-list';
    for (const m of list) {
      const row = document.createElement('label');
      const isDef = m.selector === vm.def;
      row.className = 'vm-item' + (isDef ? ' def' : '');
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = vm.sel.has(m.selector) || isDef;
      cb.disabled = !vm.managed || isDef;
      cb.onchange = () => { cb.checked ? vm.sel.add(m.selector) : vm.sel.delete(m.selector); renderModels(); };
      const mn = document.createElement('span'); mn.className = 'mname'; mn.textContent = m.name;
      if (isDef) mn.dataset.tag = t().vmDefTag;
      const sl = document.createElement('span'); sl.className = 'sel'; sl.textContent = m.selector;
      row.append(cb, mn, sl);
      ul.appendChild(row);
    }
    wrap.append(head, ul);
    box.appendChild(wrap);
  }
  vmStatus();
}
document.getElementById('vm-q').oninput = () => renderModels();
document.getElementById('vm-reset').onclick = () => { vm.sel = new Set(vm.saved); renderModels(); };
document.getElementById('vm-save').onclick = async () => {
  const r = await fetch('/api/visibility', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({visible: [...vm.sel]})}).then(x => x.json());
  if (!r.ok) { toast(t().failed(r.error), true); return; }
  applyVisibility(r);
  toast(t().vmSaved(r.visible.length));
  load(); // 刷新角色页下拉候选
};
/* ---------- 用量 / Usage（omp usage --json） ---------- */
const us = { data: null, timer: null };
const U_UNITS = { percent: '%', tokens: ' tok', requests: ' req', credits: ' cr',
                  minutes: ' min', bytes: ' B', usd: ' $' };

function fmtAmt(v, unit) {
  if (v === null || v === undefined) return '—';
  const n = unit === 'percent' ? Math.round(v) : (Number.isInteger(v) ? v : +v.toFixed(1));
  return n + (U_UNITS[unit] ?? '');
}
function fmtDur(ms) { // 重置倒计时
  if (ms <= 0) return t().uResetNow;
  const s = Math.ceil(ms / 1000), d = Math.floor(s / 86400),
        h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (LANG === 'zh')
    return (d ? `${d} 天 ` : '') + (h ? `${h} 小时 ` : '') + (d || h ? '' : `${m} 分`);
  return (d ? `${d}d ` : '') + (h ? `${d || h ? h : 0}h ` : '') + (d || h ? '' : `${m}m`);
}
function fmtTime(ts) {
  const d = new Date(ts);
  const sameDay = d.toDateString() === new Date().toDateString();
  return d.toLocaleTimeString(LANG === 'zh' ? 'zh-CN' : 'en-US',
    { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' }) +
    (sameDay ? '' : ' ' + d.toLocaleDateString(LANG === 'zh' ? 'zh-CN' : 'en-US'));
}
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString(LANG === 'zh' ? 'zh-CN' : 'en-US',
    { year: 'numeric', month: 'numeric', day: 'numeric' });
}

async function loadUsage() {
  const btn = document.getElementById('u-refresh');
  btn.disabled = true;
  if (!us.data) {
    const box = document.getElementById('u-box');
    box.innerHTML = '';
    const e = document.createElement('div');
    e.className = 'empty-hint'; e.textContent = t().uLoading;
    box.appendChild(e);
  }
  try {
    const r = await fetch('/api/usage').then(x => x.json());
    if (r && r.error) { toast(t().failed(r.error), true); showUsageMsg(r.error); }
    else { us.data = r; renderUsage(); }
  } catch (e) {
    toast(t().failed(e.message || e), true);
    if (!us.data) showUsageMsg(String(e));
  }
  btn.disabled = false;
}
function showUsageMsg(msg) {
  if (us.data) return; // 有旧数据时只 toast，不清屏
  const box = document.getElementById('u-box');
  box.innerHTML = '';
  const e = document.createElement('div');
  e.className = 'empty-hint';
  e.textContent = msg ? `${t().failed(msg)} — ${t().uEmpty}` : t().uEmpty;
  box.appendChild(e);
}

function renderUsage() {
  const d = us.data;
  const box = document.getElementById('u-box');
  box.innerHTML = '';
  document.getElementById('u-updated').textContent = t().uUpdated(fmtTime(Date.now()));
  for (const a of (d.accountsWithoutUsage || [])) {
    const e = document.createElement('div');
    e.className = 'u-extra';
    e.textContent = '⚠ ' + [a.provider, a.email || a.accountId].filter(Boolean).join(' — ') +
                    ' · ' + t().uNoUsageAcct(1).replace(/ ×1$/, '');
    box.appendChild(e);
  }
  for (const c of (d.disabledCredentials || [])) {
    const e = document.createElement('div');
    e.className = 'u-extra';
    e.textContent = '⚠ ' + [c.provider, c.email || c.accountId].filter(Boolean).join(' — ') +
                    ' · ' + t().uDisabledCred(1).replace(/ ×1$/, '');
    box.appendChild(e);
  }
  const reports = (d.reports || []);
  if (!reports.length) {
    const e = document.createElement('div');
    e.className = 'empty-hint'; e.textContent = t().uEmpty;
    box.appendChild(e);
    return;
  }
  for (const rep of reports) box.appendChild(uCard(rep));
}

function uCard(rep) {
  const card = document.createElement('div');
  card.className = 'u-card';
  const head = document.createElement('div');
  head.className = 'u-head';
  const pn = document.createElement('span');
  pn.className = 'pname'; pn.textContent = rep.provider || '?';
  head.appendChild(pn);
  const md = rep.metadata || {};
  const metaBits = [md.email, md.planType].filter(Boolean);
  if (metaBits.length) {
    const me = document.createElement('span');
    me.className = 'meta'; me.textContent = metaBits.join(' · ');
    head.appendChild(me);
  }
  if (rep.fetchedAt) {
    const ft = document.createElement('span');
    ft.className = 'ftime'; ft.textContent = t().uFetched(fmtTime(rep.fetchedAt));
    head.appendChild(ft);
  }
  const fb = document.createElement('button');
  fb.className = 'ghost u-mini';
  fb.textContent = t().uForce;
  fb.title = t().uForceTitle;
  fb.onclick = e => { e.stopPropagation(); invalidateUsage(rep.provider); };
  head.appendChild(fb);
  card.appendChild(head);

  // 共享窗口（sharedGroup）在多个子供应商下重复出现，去重
  const seen = new Set();
  let shown = 0;
  for (const l of (rep.limits || [])) {
    const g = l.scope && l.scope.sharedGroup;
    const key = (g || l.id || '') + '|' + ((l.window || {}).id || '');
    if (seen.has(key)) continue;
    seen.add(key);
    card.appendChild(uLimitRow(l));
    shown++;
  }
  if (!shown && !(rep.notes || []).length) {
    const e = document.createElement('div');
    e.className = 'u-note'; e.style.borderTop = '0'; e.textContent = t().uNoLimits;
    card.appendChild(e);
  }
  const rc = rep.resetCredits;
  if (rc && rc.availableCount) {
    const e = document.createElement('div');
    e.className = 'u-note';
    const exp = [...new Set((rc.credits || []).filter(c => c.status === 'available' && c.expiresAt)
      .map(c => fmtDate(c.expiresAt)))].join(' / ');
    e.textContent = t().uCredits(rc.availableCount) + (exp ? ' · ' + t().uExpire(exp) : '') + ' · ' + t().uResetHint;
    card.appendChild(e);
  }
  if (rep.resettable) {
    const rb = document.createElement('button');
    rb.className = 'u-mini u-redeem';
    const credits = (rep.resetCredits && rep.resetCredits.availableCount) || 0;
    rb.disabled = credits < 1;
    rb.textContent = t().uRedeem;
    rb.onclick = e => { e.stopPropagation(); redeemUsage(rep.provider, rb); };
    card.appendChild(rb);
  }
  for (const n of (rep.notes || [])) {
    const e = document.createElement('div');
    e.className = 'u-note'; e.textContent = n;
    card.appendChild(e);
  }
  return card;
}

function uLimitRow(l) {
  const row = document.createElement('div');
  row.className = 'u-row';
  const amt = l.amount || {}, win = l.window || {};
  const unit = amt.unit || 'percent';
  const top = document.createElement('div');
  top.className = 'ltop';
  const nm = document.createElement('span');
  nm.className = 'lname'; nm.textContent = l.label || l.id || '';
  if (win.label && win.label !== l.label) {
    const sc = document.createElement('span');
    sc.className = 'lscope'; sc.textContent = win.label;
    nm.appendChild(sc);
  }
  const am = document.createElement('span');
  am.className = 'amt';
  const usedFrac = amt.usedFraction != null
    ? amt.usedFraction
    : (amt.limit ? (amt.used || 0) / amt.limit : null);
  const remaining = amt.remaining != null ? amt.remaining
    : amt.limit != null && amt.used != null ? amt.limit - amt.used
    : unit === 'percent' && amt.used != null ? 100 - amt.used
    : unit === 'percent' && usedFrac != null ? (1 - usedFrac) * 100
    : null;
  am.textContent = t().uRemain(fmtAmt(remaining, unit))
    + (amt.limit != null && unit !== 'percent' ? ` / ${fmtAmt(amt.limit, unit)}` : '');
  top.append(nm, am);
  row.appendChild(top);

  const frac = usedFrac != null ? 1 - usedFrac : 0; // bar length = remaining share
  const bar = document.createElement('div');
  bar.className = 'u-bar';
  const fill = document.createElement('div');
  fill.className = 'u-fill' + (l.status && l.status !== 'ok' ? ' ' + l.status : '');
  fill.style.width = Math.min(100, Math.max(0, frac * 100)) + '%';
  bar.appendChild(fill);
  row.appendChild(bar);

  const sub = document.createElement('div');
  sub.className = 'u-sub';
  const bits = [];
  if (amt.used != null && amt.limit != null && unit !== 'percent') bits.push(t().uUsed(fmtAmt(amt.used, unit)));
  if (l.status && l.status !== 'ok') bits.push(l.status);
  const left = document.createElement('span');
  left.textContent = bits.join(' · ');
  sub.appendChild(left);
  if (win.resetsAt) {
    const rs = document.createElement('span');
    rs.className = 'reset'; rs.dataset.resetsAt = win.resetsAt;
    rs.textContent = t().uReset + '…';
    sub.appendChild(rs);
  }
  row.appendChild(sub);
  return row;
}

/* ---------- 账号 / Accounts（omp usage accounts + auth.accountPolicies） ---------- */
const ac = { data: null };
function mk(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
document.getElementById('a-refresh').onclick = () => loadAccounts();
async function loadAccounts() {
  const btn = document.getElementById('a-refresh'), box = document.getElementById('a-box');
  btn.disabled = true;
  if (!ac.data) { box.innerHTML = ''; box.appendChild(mk('div', 'empty-hint', t().uLoading)); }
  try {
    const r = await fetch('/api/accounts').then(x => x.json());
    if (r.error) {
      toast(t().failed(r.error), true);
      if (!ac.data) { box.innerHTML = ''; box.appendChild(mk('div', 'empty-hint', t().failed(r.error))); }
    } else { ac.data = r; renderAccounts(); }
  } catch (e) { toast(t().failed(e.message || e), true); }
  btn.disabled = false;
}
async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                               body: JSON.stringify(body) });
  return r.json();
}
function renderAccounts() {
  const d = ac.data, box = document.getElementById('a-box');
  box.innerHTML = '';
  document.getElementById('a-updated').textContent = t().uUpdated(fmtTime(Date.now()));
  box.appendChild(mk('div', 'vm-note', t().aIntro));
  if (d.policyError) box.appendChild(mk('div', 'u-extra', '⚠ ' + d.policyError));
  if (d.usageError) box.appendChild(mk('div', 'u-extra', '⚠ ' + d.usageError));

  const rv = mk('div', 'a-pol');
  rv.appendChild(mk('span', '', t().aReserve));
  const ri = mk('input'); ri.type = 'number'; ri.min = 0; ri.max = 100;
  ri.value = d.defaultReserveSet ? d.defaultReservePct : '';
  ri.placeholder = t().aDefaultPh(d.defaultReservePct);
  const rs = mk('button', 'u-mini', t().aSave);
  rs.onclick = async () => {
    const r = await postJSON('/api/set-key', { key: 'retry.usageReservePct', value: ri.value.trim() });
    if (r.error) toast(t().failed(r.error), true); else { toast(t().aSaved); loadAccounts(); }
  };
  rv.append(ri, rs);
  if (!d.defaultReserveSet) rv.appendChild(mk('span', '', t().aReserveUnset));
  box.appendChild(rv);

  for (const p of d.providers) {
    const card = mk('div', 'u-card');
    const head = mk('div', 'u-head');
    head.appendChild(mk('span', 'pname', p.provider));
    head.appendChild(mk('span', 'meta', `× ${p.accounts.length}`));
    card.appendChild(head);
    for (const a of p.accounts) card.appendChild(accountBlock(p.provider, a, d));
    box.appendChild(card);
  }

  if (d.stale.length) {
    const card = mk('div', 'u-card');
    const head = mk('div', 'u-head');
    head.appendChild(mk('span', 'pname', t().aStale));
    card.appendChild(head);
    card.appendChild(mk('div', 'u-extra', t().aStaleHint));
    for (const s of d.stale) {
      const row = mk('div', 'a-pol');
      const bits = [s.provider, Object.entries(s.account).map(([k, v]) => `${k}=${v}`).join(', ')];
      if (s.priority != null) bits.push(`${t().aPriority} ${s.priority}`);
      if (s.reservePct != null) bits.push(`${t().aReservePct} ${s.reservePct}`);
      row.appendChild(mk('span', '', bits.join(' · ')));
      const del = mk('button', 'ghost u-mini', t().aDelete);
      del.disabled = !d.editable;
      del.onclick = async () => {
        const r = await postJSON('/api/accounts/policy-delete',
                                 { index: s.index, provider: s.provider, account: s.account });
        if (r.error) toast(t().failed(r.error), true); else { toast(t().aDeleted); loadAccounts(); }
      };
      row.appendChild(del);
      card.appendChild(row);
    }
    box.appendChild(card);
  }
}
function accountBlock(provider, a, d) {
  const x = mk('div', 'a-acct');
  const id = mk('div', 'a-id');
  id.appendChild(mk('span', '', a.email || a.accountId || '?'));
  const meta = [a.orgName, a.plan].filter(Boolean).join(' · ');
  if (meta) id.appendChild(mk('span', 'meta', meta));
  const off = !!(a.policy && a.policy.reservePct === 100);
  if (off) id.appendChild(mk('span', 'a-tag', t().aDisabledTag));
  else if (a.policy) id.appendChild(mk('span', 'a-tag', t().aHasPolicy));
  x.appendChild(id);
  const rep = a.report || {};
  const seen = new Set();
  for (const l of (rep.limits || [])) {
    const g = l.scope && l.scope.sharedGroup;
    const key = (g || l.id || '') + '|' + ((l.window || {}).id || '');
    if (seen.has(key)) continue;
    seen.add(key);
    const row = uLimitRow(l);
    const rs = row.querySelector('[data-resets-at]');
    if (rs) rs.textContent = t().uReset + fmtDur(+rs.dataset.resetsAt - Date.now());
    x.appendChild(row);
  }
  const rc = rep.resetCredits;
  if (rc && rc.availableCount) x.appendChild(mk('div', 'u-note', t().uCredits(rc.availableCount)));

  const pol = mk('div', 'a-pol');
  const pr = mk('input'); pr.type = 'number'; pr.step = 1;
  pr.value = a.policy && a.policy.priority != null ? a.policy.priority : '';
  pr.placeholder = '0';
  const rp = mk('input'); rp.type = 'number'; rp.min = 0; rp.max = 100;
  rp.value = a.policy && a.policy.reservePct != null ? a.policy.reservePct : '';
  rp.placeholder = t().aDefaultPh(d.defaultReservePct);
  const save = mk('button', 'u-mini', t().aSave);
  const clear = mk('button', 'ghost u-mini', t().aClear);
  save.disabled = clear.disabled = !d.editable;
  clear.disabled = clear.disabled || !a.policy;
  const send = async (priority, reservePct) => {
    const r = await postJSON('/api/accounts/policy', { provider, identityKey: a.identityKey,
      priority, reservePct, extra: { accountId: a.accountId } });
    if (r.error) toast(t().failed(r.error), true); else { toast(t().aSaved); loadAccounts(); }
  };
  save.onclick = () => send(pr.value.trim(), rp.value.trim());
  clear.onclick = () => send('', '');
  const tog = mk('button', off ? 'u-mini' : 'ghost u-mini', off ? t().aEnable : t().aDisable);
  tog.disabled = !d.editable;
  tog.title = t().aDisableNote;
  tog.onclick = () => send(pr.value.trim(), off ? '' : 100);
  pol.append(mk('span', '', t().aPriority), pr, mk('span', '', t().aReservePct), rp, save, clear, tog);
  if (!a.policy) pol.appendChild(mk('span', '', t().aNoPolicy));
  x.appendChild(pol);
  if (off) x.appendChild(mk('div', 'u-extra', t().aDisableNote));
  return x;
}

function tickUsage() { // 每秒更新倒计时；勾选自动刷新时每 60s 重拉
  document.querySelectorAll('#u-box [data-resets-at]').forEach(el => {
    const ms = +el.dataset.resetsAt - Date.now();
    el.textContent = t().uReset + fmtDur(ms);
  });
  if (document.getElementById('u-auto').checked && Date.now() - (us.lastPoll || 0) >= 60000) {
    us.lastPoll = Date.now();
    loadUsage();
  }
}
function startUsageTimer() {
  if (us.timer) return;
  us.lastPoll = Date.now();
  us.timer = setInterval(tickUsage, 1000);
}
function stopUsageTimer() {
  if (us.timer) { clearInterval(us.timer); us.timer = null; }
}
document.getElementById('u-force').onclick = () => invalidateUsage('all');

async function invalidateUsage(provider) {
  const btn = document.getElementById('u-force');
  btn.disabled = true;
  try {
    const r = await fetch('/api/usage/invalidate', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({provider})}).then(x => x.json());
    if (r.error) { toast(t().failed(r.error), true); return; }
    toast(t().uForceDone);
    us.lastPoll = Date.now(); // 避免刚强刷完又被轮询立刻重抓
    await loadUsage();
  } catch (e) {
    toast(t().failed(e.message || e), true);
  } finally {
    btn.disabled = false;
  }
}

async function redeemUsage(provider, btn) {
  if (!confirm(t().uRedeemConfirm(provider))) return;
  btn.disabled = true;
  btn.textContent = t().uRedeeming;
  try {
    const r = await fetch('/api/usage/redeem', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({provider})}).then(x => x.json());
    if (r.ok) {
      toast(t().uRedeemDone);
      await loadUsage();
    } else {
      toast(t().failed(r.error || r.code || 'unknown'), true);
    }
  } catch (e) {
    toast(t().failed(e.message || e), true);
  } finally {
    btn.disabled = false;
    btn.textContent = t().uRedeem;
  }
}
document.getElementById('u-refresh').onclick = () => loadUsage();


applyStaticLang();
load();
</script>
